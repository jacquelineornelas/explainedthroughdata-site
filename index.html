    :root { --warm-paper:#FAF8F5; --deep-navy:#20303A; --brass:#B0895E; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; }

      font-family:'Montserrat',sans-serif; min-height:100svh;
      display:flex; flex-direction:column;
    }
    .site-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:20px 40px; gap:24px; flex-wrap:wrap;

    .site-header .logo { width:260px; max-width:60vw; height:auto; }

    .site-header nav a:hover { opacity:1; color:var(--brass); }
    main { flex:1; display:flex; align-items:center; justify-content:center; padding:12px 24px 48px; }
    .hero { max-width:820px; text-align:center; display:flex; flex-direction:column; align-items:center; }

    .cta {
      display:inline-block; background:var(--brass); color:var(--warm-paper);
      font-size:1.125rem; font-weight:500; padding:14px 36px;
      border-radius:999px; text-decoration:none; transition:background-color .2s ease;
    }
    .cta:hover { background:#C2A06A; }
    .case-study-link {
      display:inline-block; margin-top:20px; font-size:0.95rem; color:var(--brass);
      text-decoration:none; border-bottom:1px solid transparent; transition:border-color .2s ease;
    }
    .case-study-link:hover { border-bottom-color:var(--brass); }
    footer {
      text-align:center; padding:16px 24px; font-size:0.875rem;
      color:rgba(32,48,58,0.5); flex-shrink:0;

  <script>
    // Live day counter: computes the project day from the calendar. Zero maintenance.
    (function(){
      var start = new Date('2026-06-07T00:00:00');
      var now = new Date();
      var day = Math.floor((now - start) / 86400000) + 1;
      var el = document.getElementById('dayline');
      if (day >= 1 && day <= 90) {
        el.textContent = 'Day ' + day + ' of 90, documented daily.';
      } else if (day > 90) {
        el.textContent = 'The first 90 days built the system. Day ' + day + ' and still documenting.';
      }
    })();
  </script>
